<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3 Cartas para ti - Camila y Josué</title>
<style>
  body{margin:0;font-family:'Segoe UI',sans-serif;background:#ffdde1;background:linear-gradient(180deg,#ffdde1,#ee9ca7);min-height:100vh;text-align:center;padding:20px}
  h1{color:#b81d4a;margin-top:10px} .sub{color:#fff;font-size:18px}
  .musica{background:white;padding:10px 20px;border-radius:50px;display:inline-block;margin:15px;box-shadow:0 5px 15px rgba(0,0,0,.1)}
  .fotos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;max-width:400px;margin:20px auto}
  .fotos img{width:100%;height:110px;object-fit:cover;border-radius:15px;border:3px solid white;box-shadow:0 5px 10px rgba(0,0,0,.1)}
  .sobres{display:flex;flex-direction:column;gap:20px;max-width:400px;margin:30px auto}
  .sobre{background:white;border-radius:20px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.15);cursor:pointer;transition:.3s;position:relative}
  .sobre:active{transform:scale(.97)}
  .sobre .emoji{font-size:50px} .sobre h2{color:#ff4d6d;margin:10px 0 5px} .sobre p{color:#888;font-size:14px;margin:0}
  .carta-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:10;overflow-y:auto}
  .carta-modal.activo{display:flex}
  .carta-contenido{background:#fffaf0;border-radius:20px;padding:25px;max-width:450px;text-align:left;line-height:1.7;color:#444;position:relative;max-height:85vh;overflow-y:auto}
  .carta-contenido .cerrar{position:sticky;top:0;float:right;background:#ff4d6d;color:white;border:none;border-radius:50%;width:35px;height:35px;font-size:20px;cursor:pointer}
  .firma{font-weight:bold;color:#ff4d6d;margin-top:20px;display:block;text-align:right}
  audio{width:100%;margin-top:10px}
</style>
</head>
<body>

<h1>💌 3 Cartas para ti 💌</h1>
<p class="sub">Camila & Josué - Para Siempre</p>

<div class="musica">
  🎵 Perfect - Ed Sheeran 🎵 <br>
  <audio controls autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a650f6.mp3?filename=perfect-ed-sheeran-piano-cover-112199.mp3" type="audio/mpeg">
    <!-- Si subes tu cancion como perfect.mp3, cambia el src arriba por perfect.mp3 -->
  </audio>
  <div style="font-size:11px;color:#999">Si no suena, sube tu archivo perfect.mp3</div>
</div>

<div class="fotos">
  <img src="foto1.jpg" onerror="this.src='https://picsum.photos/300/300?random=1'">
  <img src="foto2.jpg" onerror="this.src='https://picsum.photos/300/300?random=2'">
  <img src="foto3.jpg" onerror="this.src='https://picsum.photos/300/300?random=3'">
  <img src="foto4.jpg" onerror="this.src='https://picsum.photos/300/300?random=4'">
  <img src="foto5.jpg" onerror="this.src='https://picsum.photos/300/300?random=5'">
  <img src="foto6.jpg" onerror="this.src='https://picsum.photos/300/300?random=6'">
</div>

<div class="sobres">
  <div class="sobre" onclick="abrir(1)">
    <div class="emoji">💌</div>
    <h2>Carta 1</h2>
    <p>Para cuando te extraño demasiado - Toca para abrir</p>
  </div>
  <div class="sobre" onclick="abrir(2)">
    <div class="emoji">💖</div>
    <h2>Carta 2</h2>
    <p>Lo que me haces sentir - Toca para abrir</p>
  </div>
  <div class="sobre" onclick="abrir(3)">
    <div class="emoji">💍</div>
    <h2>Carta 3</h2>
    <p>Nuestra promesa - Toca para abrir</p>
  </div>
</div>

<div id="modal" class="carta-modal" onclick="cerrar()">
  <div class="carta-contenido" onclick="event.stopPropagation()">
    <button class="cerrar" onclick="cerrar()">×</button>
    <div id="textoCarta"></div>
  </div>
</div>

<script>
const cartas = {
1: `Mi amor,<br><br>No sé por dónde empezar porque hay tanto que te quiero decir y nunca me alcanzan las palabras.<br><br>Hay días que te extraño tanto que me duele el pecho. No es un dolor feo, es ese dolor bonito de saber que amas a alguien tanto que tu cuerpo lo siente cuando no está.<br><br>Desde que llegaste a mi vida, todo tiene más color. Antes los días eran normales, ahora todos los días son "un día más contigo" y eso lo cambia todo.<br><br>Gracias por tu paciencia cuando estoy sensible, gracias por tu risa cuando estoy triste, gracias por abrazarme como si no me fueras a soltar nunca. Esos abrazos son mi lugar seguro.<br><br>No importa cuántos meses o años diga nuestro calendario, yo siento que te conozco de toda la vida. Siento que mi alma ya te conocía antes de que nos encontráramos aquí.<br><br>Te amo hoy, mañana y siempre que me dejen amarte.<br><span class="firma">Tuya, Camila</span>`,
2: `Josué,<br><br>Si alguien me preguntara qué es amar, yo le enseñaría una foto tuya. Le mostraría cómo me miras, cómo me cuidas, cómo me haces reír incluso cuando quiero estar enojada.<br><br>Contigo aprendí que el amor no es perfecto, es real. Es quedarnos aunque estemos cansados, es hablar aunque nos cueste, es elegirnos todos los días, no solo los días bonitos.<br><br>Me encantas. Me encanta tu forma de ser, tu voz cuando me dices "mi amor", tus manos, tu forma de abrazarme por la espalda. Me encanta el futuro que me imagino contigo.<br><br>A veces tengo miedo, miedo de perderte, miedo de no ser suficiente. Pero luego me recuerdas con una sola acción que estoy justo donde debo estar: contigo.<br><br>Eres mi persona favorita en este mundo entero. No te cambiaría por nada.<br><br>¿Te quedas conmigo muchos, muchos años más?<br><span class="firma">Con todo mi corazón, Tu niña</span>`,
3: `Amor de mi vida,<br><br>Esta es nuestra historia y apenas está empezando.<br><br>Quiero que cuando veamos nuestro calendario en 1 año, en 5 años, en 20 años, nos acordemos de este momento, de cuando éramos tú y yo contra todo, empezando, con una página de internet que hicimos con tanto amor.<br><br>Yo te prometo esto:<br>Te prometo cuidarte en tus días malos.<br>Te prometo celebrar contigo cada uno de tus logros.<br>Te prometo ser tu paz, no tu guerra.<br>Te prometo no irme cuando sea difícil.<br>Te prometo amarte con la misma intensidad del primer día.<br><br>Tú no eres solo mi novio, eres mi compañero de vida. Eres mi hogar.<br><br>Gracias por existir. Gracias por elegirme.<br><span class="firma">Siempre juntos, Camila & Josué - Para siempre</span>`
};
function abrir(n){ document.getElementById('textoCarta').innerHTML = cartas[n]; document.getElementById('modal').classList.add('activo'); }
function cerrar(){ document.getElementById('modal').classList.remove('activo'); }
</script>
</body>
</html>
